[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogbank-ocr"
version = "0.1.0"
description = "CatalogBank OCR pipeline using PaddleOCR PP-StructureV3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "torch>=2.2",
  "paddlepaddle>=3.0",
  "paddleocr>=3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
