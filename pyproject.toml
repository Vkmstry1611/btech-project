[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogbank-ocr"
version = "0.1.0"
description = "CatalogBank OCR pipeline using PaddleOCR PP-StructureV3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "torch>=2.2",
  "paddlepaddle>=3.0",
  "paddleocr>=3.0",
  "paddlex[ocr]>=3.0",
  "networkx>=3.0",
  "beautifulsoup4>=4.12",
  "pydantic>=2.0",
  "ollama>=0.3",
  "neo4j>=5.0",
]

[project.optional-dependencies]
# Slim deployment extras (no OCR / no LLM / no heavy ML stack).
# `pip install -e ".[deploy]"` installs only the lightweight runtime needed by
# scripts/run_mock_pipeline.py + the FastAPI service, NOT the full OCR/LLM stack.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
deploy = ["dvc>=3.50", "fastapi>=0.110", "uvicorn[standard]>=0.27", "PyYAML>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
