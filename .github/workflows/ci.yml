name: CI

# Triggers on every branch push (so feature branches auto-run) and on PRs.
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  # --- Reproduce the deployment pipeline + validate the API (slim env) -------
  deploy-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Install deploy dependencies (no OCR / no LLM)
        run: pip install -r requirements-deploy.txt

      - name: Install package without heavy core deps
        run: pip install --no-deps -e .

      - name: Reproduce pipeline (DVC)
        run: dvc repro

      - name: Show reproduced artifacts
        run: |
          echo "::group::run_summary"
          cat outputs/deploy/run_summary.json
          echo "::endgroup::"
          echo "::group::evaluation"
          cat outputs/deploy/evaluation.json
          echo "::endgroup::"

      - name: API smoke test
        run: python scripts/smoke_test_api.py

      - name: Stage-2 unit tests (light subset, no OCR/PIL)
        continue-on-error: true
        run: pytest tests/test_catalog_refinement.py -k "not streaming_pixels" -q

  # --- Validate the Docker image builds and serves --------------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t catalogbank-ocr-api:ci .

      - name: Run image and probe endpoints
        run: |
          docker run -d -p 8000:8000 --name api catalogbank-ocr-api:ci
          sleep 6
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/catalogs | grep -q industrial_fittings_5_pages
          curl -sf "http://localhost:8000/catalogs/industrial_fittings_5_pages/search?q=1455N117" | grep -q 1455N117
          docker logs api
          docker stop api || true
